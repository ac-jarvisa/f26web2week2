<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles/styles.css" rel="stylesheet">
    <title>Week 2 Review of Flex and Grid</title>
</head>
<body>
    <div class="container">
        <!-- Prompt to generate the nav:
         inside the container div, add a nav with ul inside. In the UL add five list items, in all except the fourth li, add an anchor with # as the link, one each for home, about, stuff, and contact. In the fourth LI, and a UL, with four LI inside, and in each of those LI, add a anchor with # as the link, and a random word about dogs.
         -->
        <nav>
            <ul>
                <li>
                    <a href="#">
                        <img src="images/happy-puppy.avif" alt="A very happy puppy against a green background">
                    </a>
                </li>
                <li><a href="#">About</a></li>
                <li><a href="#">Stuff</a></li>
                <li>
                    <a href="#">Dogs</a>                    
                    <ul>
                        <li><a href="#">Paw</a></li>
                        <li><a href="#">Fetch</a></li>
                        <li><a href="#">Bark</a></li>
                        <li><a href="#">Leash</a></li>
                    </ul>
                </li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <main>
            <!-- prompt to generate the divs:
             inside the main, add a section with 6 divs, each with an increasing number from 1 to 6 -->
            <section>
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
            </section>
        </main>
    </div>
</body>
</html>
